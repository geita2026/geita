# Reverse-proxy /award/ to the Node app (Next.js :3000, Express API :4000).
# Add this INSIDE the existing tradefair.tantrade.go.tz <VirtualHost> block
# (the HTTPS one, and the HTTP one too if it isn't a pure redirect).
#
# Enable the required modules once:
#   sudo a2enmod proxy proxy_http headers
#   sudo systemctl reload apache2
#
# Order matters: the more specific /award/api must come BEFORE /award.

ProxyPreserveHost On
ProxyRequests Off

# --- API: strip /award/api and forward to Express on :4000 ---
ProxyPass        /award/api  http://127.0.0.1:4000
ProxyPassReverse /award/api  http://127.0.0.1:4000

# --- Next.js app: keep the /award prefix (matches Next basePath) ---
ProxyPass        /award      http://127.0.0.1:3000/award
ProxyPassReverse /award      http://127.0.0.1:3000/award
