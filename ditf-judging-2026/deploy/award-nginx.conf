# DITF Judging app on nginx at https://tradefair.tantrade.go.tz/award/
#
#   Browser ──https──> nginx (tradefair.tantrade.go.tz, docroot = /var/www/tradefair.tantrade.go.tz)
#     ├─ /award/api/*  ──proxy──> 127.0.0.1:4000   (Express API, pm2: award-api)
#     └─ /award/*      ──static─> <docroot>/award/  (Next.js static export, git-deployed)
#
# Paste these two location blocks INSIDE the existing
#   server { server_name tradefair.tantrade.go.tz; ... }   (the HTTPS/443 block)
# then:  sudo nginx -t && sudo systemctl reload nginx
#
# The API location is more specific (/award/api/) so nginx's longest-prefix match
# routes it before the static /award/ block regardless of order.

# --- API: strip /award/api and forward the rest to Express on :4000 ---
# The trailing slash on proxy_pass rewrites  /award/api/auth/login  ->  /auth/login
location /award/api/ {
    proxy_pass         http://127.0.0.1:4000/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}

# --- Static frontend: serve the Next.js export from the docroot ---
# trailingSlash:true means folder URLs (/award/judge/) resolve to .../index.html.
location /award/ {
    index     index.html;
    try_files $uri $uri/ =404;
}
