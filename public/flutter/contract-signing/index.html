<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/flutter/contract-signing/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="contract_signing_tantrade">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>contract_signing_tantrade</title>
  <link rel="manifest" href="manifest.json">

  <style>
    #preloader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity .4s ease;
    }

    #preloader.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    #preloader img {
      width: 140px;
      margin-bottom: 28px;
    }

    .loader-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e5e7eb;
      border-top: 4px solid #1a237e;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #preloader p {
      margin-top: 18px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      color: #6b7280;
    }
  </style>

</head>
<body>

  <!-- Preloader - shows while Flutter initializes -->
  <div id="preloader">
    <img src="assets/assets/logo.png" alt="TanTrade" onerror="this.style.display='none'">
    <div class="loader-spinner"></div>
    <p>Loading contract signing...</p>
  </div>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Hide preloader once Flutter renders its first frame
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('preloader');
      if (el) {
        el.classList.add('fade-out');
        setTimeout(function () { el.remove(); }, 400);
      }
    });
  </script>

</body>
</html>
